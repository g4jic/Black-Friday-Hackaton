<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SuiteSpot concept</title>
<!--
  Concept mockups for the design comparison (not app code).
  Render: node design/concepts/src/render.mjs  ->  design/concepts/<theme>/<n>-<screen>.png
  All business data below is synthetic demo data. Fonts are free substitutes from Google Fonts.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=Archivo:wdth,wght@100..125,300..800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet" />
<style>
  /* ---------- shared status rules (identical in both directions) ---------- */
  :root {
    --hard: #B4291F; --hard-bg: #FBE9E6; --hard-line: #E9B2AB;
    --soft: #8A5A00; --soft-bg: #FCF1D2; --soft-line: #EBCF84;
    --est: #6B6B6B; --est-bg: #F3F3F1; --est-line: #9A9A96;
  }
  /* ---------- A: Era + deep green ---------- */
  body.era {
    --bg: #EEEBE8; --surface: #F7F5F2; --card: #FFFDFB; --text: #282327; --muted: #676166; --border: #D4D0CB;
    --accent: #1F5C45; --on-accent: #F7F5F2; --accent-soft: #E3EDE7; --accent-text: #1F5C45;
    --font-display: "Hanken Grotesk", system-ui, sans-serif; --font-body: "Hanken Grotesk", system-ui, sans-serif;
    --display-wdth: 100; --display-weight: 500; --display-track: -0.035em;
    --r-card: 0px; --r-ctl: 6px; --r-pill: 6px; --bw: 1.3px;
    --label-case: none; --label-track: 0; --label-size: 12px;
  }
  /* ---------- B: Spade language + lime ---------- */
  body.spade {
    --bg: #FFFFFF; --surface: #F4FAED; --card: #FFFFFF; --text: #090F05; --muted: #55604C; --border: #DCE6D0;
    --accent: #B2EB76; --on-accent: #090F05; --accent-soft: #EAF8D9; --accent-text: #18280E;
    --font-display: "Archivo", system-ui, sans-serif; --font-body: "DM Sans", system-ui, sans-serif;
    --display-wdth: 118; --display-weight: 560; --display-track: -0.02em;
    --r-card: 8px; --r-ctl: 8px; --r-pill: 4px; --bw: 1px;
    --label-case: uppercase; --label-track: 0.06em; --label-size: 11px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 13px; line-height: 1.4;
         width: 1440px; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .display { font-family: var(--font-display); font-variation-settings: "wdth" var(--display-wdth); font-weight: var(--display-weight); letter-spacing: var(--display-track); }
  .label { font-size: var(--label-size); text-transform: var(--label-case); letter-spacing: var(--label-track); color: var(--muted); font-weight: 500; }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .grow { flex: 1; }

  /* top bar */
  .top { height: 56px; display: flex; align-items: center; gap: 24px; padding: 0 24px; border-bottom: var(--bw) solid var(--border); background: var(--surface); }
  body.spade .top { background: var(--bg); }
  .brand { font-family: var(--font-display); font-variation-settings: "wdth" var(--display-wdth); font-weight: 650; font-size: 18px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
  .brand i { width: 18px; height: 18px; background: var(--accent); display: inline-block; border-radius: var(--r-pill); }
  .nav { display: flex; gap: 4px; }
  .nav a { padding: 6px 12px; border-radius: var(--r-ctl); color: var(--muted); text-decoration: none; font-weight: 500; }
  .nav a.on { color: var(--text); background: var(--card); border: var(--bw) solid var(--border); }
  body.spade .nav a.on { background: var(--surface); border-color: transparent; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: var(--r-pill); font-size: 11.5px; font-weight: 500; border: var(--bw) solid var(--border); background: var(--card); white-space: nowrap; }
  .badge.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); }
  .badge.solid { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .badge.hard { background: var(--hard-bg); color: var(--hard); border-color: var(--hard-line); }
  .badge.soft { background: var(--soft-bg); color: var(--soft); border-color: var(--soft-line); }
  .badge.est { background: var(--est-bg); color: var(--est); border: var(--bw) dashed var(--est-line); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: currentColor; }

  .btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: var(--r-ctl); font-weight: 600; font-size: 13px; border: var(--bw) solid var(--border); background: var(--card); color: var(--text); }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  body.era .btn.primary { background: var(--accent); }

  .card { background: var(--card); border: var(--bw) solid var(--border); border-radius: var(--r-card); }
  body.spade .card.surface { background: var(--surface); border-color: transparent; }

  /* source chip: every number carries one */
  .src { display: inline-flex; align-items: center; gap: 4px; font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--muted); padding: 1px 6px; border-radius: var(--r-pill); border: var(--bw) solid var(--border); background: var(--surface); white-space: nowrap; }
  .src b { font-weight: 500; color: var(--accent-text); }
  .src.est { border-style: dashed; border-color: var(--est-line); background: var(--est-bg); color: var(--est); }
  .src.est b { color: var(--est); }
  .src.miss { border-color: var(--soft-line); background: var(--soft-bg); color: var(--soft); }
  .src.miss b { color: var(--soft); }

  .num { font-family: var(--font-display); font-variation-settings: "wdth" var(--display-wdth); font-weight: var(--display-weight); letter-spacing: var(--display-track); }
  .num.est { color: var(--est); }

  .page { padding: 20px 24px 28px; }
  .h1 { font-size: 30px; line-height: 1.1; }
  body.spade .h1 { font-size: 30px; }

  /* stats strip */
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); border: var(--bw) solid var(--border); border-radius: var(--r-card); background: var(--card); }
  body.spade .stats { background: var(--surface); border-color: transparent; }
  .stat { padding: 12px 16px; border-right: var(--bw) solid var(--border); }
  .stat:last-child { border-right: 0; }
  .stat .v { font-size: 30px; line-height: 1.1; margin: 4px 0 4px; }

  /* lanes */
  .lanes { padding: 14px 16px 12px; }
  .axis { display: grid; grid-template-columns: 128px 1fr; font-size: 10.5px; color: var(--muted); }
  .ticks { position: relative; height: 16px; }
  .ticks span { position: absolute; transform: translateX(-50%); font-family: "IBM Plex Mono", monospace; }
  .lane { display: grid; grid-template-columns: 128px 1fr; align-items: center; height: 46px; border-top: var(--bw) solid var(--border); }
  .lane .who { font-weight: 600; font-size: 12.5px; display: flex; flex-direction: column; line-height: 1.15; }
  .lane .who small { font-weight: 400; color: var(--muted); font-size: 10.5px; }
  .track { position: relative; height: 100%; }
  .bar { position: absolute; height: 12px; border-radius: 2px; background: var(--accent); top: 17px; font-family: "IBM Plex Mono", monospace; font-size: 9px; line-height: 12px; padding-left: 4px; color: var(--on-accent); overflow: hidden; white-space: nowrap; }
  .bar.l2 { top: 3px; } .bar.l3 { top: 31px; }
  .bar.code { background: var(--text); color: var(--bg); }
  .bar.stopped { background: repeating-linear-gradient(135deg, var(--hard) 0 3px, var(--hard-bg) 3px 6px); color: var(--hard); font-weight: 500; }
  .bar.stopped span { background: var(--hard-bg); padding: 0 3px; }
  .bar.wait { background: var(--accent-soft); border: var(--bw) dashed var(--accent-text); color: var(--accent-text); }
  .tag { position: absolute; font-family: "IBM Plex Mono", monospace; font-size: 9.5px; color: var(--muted); top: 1px; }
  .now { position: absolute; top: -18px; bottom: 0; width: 0; border-left: 1.5px solid var(--hard); }
  .now::before { content: "now 00:41"; position: absolute; top: 0; left: 4px; font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--hard); }
  .flagmark { position: absolute; top: 4px; width: 0; bottom: 4px; border-left: 1.5px dashed var(--hard); }

  /* candidate cards */
  .cands { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .cand { min-width: 0; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .cand.rejected { background: repeating-linear-gradient(135deg, transparent 0 8px, rgba(180,41,31,.04) 8px 16px), var(--card); border-color: var(--hard-line); }
  .cand .addr { font-weight: 600; font-size: 13.5px; }
  .cand .big { font-size: 26px; line-height: 1; }
  .checks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .chk { font-size: 10px; padding: 3px 4px; border-radius: var(--r-pill); text-align: center; background: var(--surface); color: var(--muted); border: var(--bw) solid var(--border); }
  .chk.done { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; font-weight: 600; }
  .chk.run { border: var(--bw) solid var(--accent); color: var(--accent-text); }
  body.spade .chk.run { border-color: #7DBF3A; }
  .chk.stop { background: var(--hard-bg); color: var(--hard); border-color: var(--hard-line); text-decoration: line-through; }
  .chk.flag { background: var(--soft-bg); color: var(--soft); border-color: var(--soft-line); }

  /* stream */
  .stream { display: flex; flex-direction: column; }
  .ev { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 8px; padding: 9px 14px; border-top: var(--bw) solid var(--border); }
  .ev:first-child { border-top: 0; }
  .ev .t { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--muted); padding-top: 2px; }
  .ev .who { font-weight: 600; }
  .ev.hard { background: var(--hard-bg); box-shadow: inset 3px 0 0 var(--hard); }
  .ev.soft { box-shadow: inset 3px 0 0 #D9A62A; }
  .ev.verify { box-shadow: inset 3px 0 0 var(--accent); }
  body.spade .ev.verify { box-shadow: inset 3px 0 0 #7DBF3A; }
  .ev p { margin-top: 2px; }
  .ev .srcs { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; }

  .sectionhead { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: var(--bw) solid var(--border); }
  .sectionhead h3 { font-size: 14px; font-weight: 600; }

  .notice { display: flex; gap: 10px; align-items: center; padding: 9px 14px; border-radius: var(--r-card); border: var(--bw) solid var(--border); background: var(--card); font-size: 12.5px; }
  body.spade .notice { background: var(--surface); border-color: transparent; }

  /* report */
  .rank { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; padding: 12px 14px; border-top: var(--bw) solid var(--border); align-items: start; }
  .rank.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  body.spade .rank.on { box-shadow: inset 3px 0 0 #7DBF3A; }
  .rank .n { font-size: 22px; line-height: 1; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: var(--bw) solid var(--border); border-radius: var(--r-card); background: var(--card); }
  body.spade .kpis { background: var(--surface); border-color: transparent; }
  .kpi { padding: 16px 18px; border-right: var(--bw) solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  .kpi:last-child { border-right: 0; }
  .kpi .v { font-size: 44px; line-height: 1; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .col h4 { font-size: 13px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; padding: 9px 0; border-top: var(--bw) solid var(--border); align-items: baseline; }
  .item .val { font-weight: 600; font-size: 14px; text-align: right; }
  .item .val.est { color: var(--est); }
  .item .s { grid-column: 1 / -1; }
  .checkitem { padding: 9px 10px; margin-top: 8px; border-radius: var(--r-pill); background: var(--soft-bg); border: var(--bw) solid var(--soft-line); color: #4A3500; font-size: 12.5px; }
  .checkitem b { color: var(--soft); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: var(--label-size); text-transform: var(--label-case); letter-spacing: var(--label-track); padding: 8px 12px; border-bottom: var(--bw) solid var(--border); }
  td { padding: 9px 12px; border-bottom: var(--bw) solid var(--border); vertical-align: middle; }
  td.r, th.r { text-align: right; }
  .range { position: relative; height: 30px; margin: 10px 0 4px; }
  .range .base { position: absolute; left: 0; right: 0; top: 13px; height: 4px; background: var(--border); border-radius: 2px; }
  .range .iqr { position: absolute; top: 9px; height: 12px; background: var(--est-bg); border: var(--bw) dashed var(--est-line); border-radius: 2px; }
  .range .me { position: absolute; top: 4px; width: 3px; height: 22px; background: var(--accent); }
  body.spade .range .me { background: #090F05; }

  /* questionnaire */
  .steps { display: flex; flex-direction: column; gap: 8px; }
  .step { padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
  .step .k { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted); padding-top: 2px; }
  .step.done .k { color: var(--accent-text); }
  .step.on { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .step.on .k, .step.on small { color: var(--on-accent); opacity: .85; }
  .step small { display: block; color: var(--muted); font-size: 11.5px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-weight: 600; font-size: 13px; }
  .input { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: var(--bw) solid var(--border); border-radius: var(--r-ctl); background: var(--card); font-size: 16px; }
  .input.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  body.spade .input.focus { border-color: #7DBF3A; }
  .input .unit { color: var(--muted); font-size: 13px; }
  .help { font-size: 12px; color: var(--muted); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt { padding: 14px; display: flex; flex-direction: column; gap: 4px; }
  .opt.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  body.spade .opt.on { background: var(--accent-soft); border-color: #7DBF3A; box-shadow: none; }
  .progress { height: 4px; background: var(--border); border-radius: 2px; position: relative; }
  .progress i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; }
  body.spade .progress i { background: #7DBF3A; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const q = new URLSearchParams(location.search)
const theme = q.get("theme") || "era"
const screenNo = q.get("screen") || "1"
document.body.className = theme

/* ===================== synthetic demo content (shared by both directions) ===================== */
const RUN = { title: "Bakery space, Novi Sad", id: "run-0412", mode: "Mode B: find candidates" }
const C = {
  c1: { addr: "Bulevar oslobođenja 42", area: 58, rent: "1,450", site: "4zida.rs", status: "rejected" },
  c2: { addr: "Zmaj Jovina 9", area: 44, rent: "1,100", site: "oglasi.rs", status: "evaluating" },
  c3: { addr: "Futoška 71", area: 52, rent: "950", site: "4zida.rs", status: "evaluating" },
  c4: { addr: "Laze Telečkog 3", area: 36, rent: "1,250", site: "svenekretnine.com", status: "evaluating" },
  c5: { addr: "Narodnog fronta 23", area: 61, rent: "890", site: "4zida.rs", status: "found" },
}
const src = (kind, ref, cls = "") => `<span class="src ${cls}"><b>${kind}</b> ${ref}</span>`
const badge = (cls, text, dot = true) => `<span class="badge ${cls}">${dot ? '<span class="dot"></span>' : ""}${text}</span>`

function topBar(active) {
  const items = ["New research", "Live", "Report", "History"]
  return `<div class="top">
    <div class="brand"><i></i>SuiteSpot</div>
    <nav class="nav">${items.map((n) => `<a class="${n === active ? "on" : ""}">${n}</a>`).join("")}</nav>
    <div class="grow"></div>
    ${badge("est", "Demo data, synthetic", false)}
    ${badge("", "Keyless mock mode", false)}
  </div>`
}
const disclaimer = `<div class="notice"><span class="badge soft" style="flex:none">Not financial advice</span>
  <span>SuiteSpot compares lease costs from public listings and your own numbers. It does not give legal advice on permitted use. Check every item marked <b>check before signing</b> with the landlord or a lawyer.</span></div>`

/* ===================== 1. live research ===================== */
function live() {
  const T = 45, pct = (s) => (s / T) * 100
  const bar = (a, b, cls = "", label = "", lvl = "") =>
    `<div class="bar ${cls} ${lvl}" style="left:${pct(a)}%;width:${pct(b - a)}%"><span>${label}</span></div>`
  const lanes = [
    ["Scout", "LLM, web search", [[0, 4, "", "search"], [4, 6, "", "c1"], [6, 9, "", "c2"], [9, 13, "", "c3"], [13, 17, "", "c4"], [33, 37, "", "c5"]]],
    ["Lease reader", "LLM, 1 loop per candidate", [[6, 14, "stopped", "c1 stopped 14s", ""], [9, 22, "", "c2", "l2"], [13, 26, "", "c3", "l3"], [17, 32, "", "c4", ""], [37, 41, "", "c5", "l2"]]],
    ["Location", "LLM + OSM", [[6, 14, "stopped", "c1 stopped", "l2"], [9, 25, "", "c2", ""], [13, 30, "", "c3", "l3"], [17, 41, "", "c4", "l2"]]],
    ["Premises", "LLM, photos + text", [[6, 14, "stopped", "c1 stopped", "l3"], [9, 20, "", "c2", "l2"], [13, 34, "", "c3", ""], [17, 41, "", "c4", "l3"]]],
    ["Finance", "plain code", [[7, 8, "code", "c1"], [22, 23, "code", "c2"], [26, 27, "code", "c3"], [32, 33, "code", "c4"]]],
    ["Verifier", "LLM, checks claims", [[14, 19, "", "c2", "l2"], [23, 29, "", "c2"], [27, 35, "", "c3", "l3"], [34, 41, "", "c4", "l2"]]],
    ["You", "approval breakpoint", [[29, 41, "wait", "approve OSM batch for c4?"]]],
  ]
  const ticks = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45]
  const laneHtml = lanes.map(([n, s, bars]) => `<div class="lane"><div class="who">${n}<small>${s}</small></div><div class="track">${bars.map((b) => bar(...b)).join("")}<div class="flagmark" style="left:${pct(8)}%"></div></div></div>`).join("")

  const chk = (labels) => `<div class="checks">${labels.map(([t, c]) => `<div class="chk ${c}">${t}</div>`).join("")}</div>`
  const card = (id, extra) => {
    const c = C[id]
    const st = { rejected: badge("hard", "Rejected"), evaluating: badge("accent", "Evaluating"), found: badge("", "Found, queued") }[c.status]
    return `<div class="card cand ${c.status}">
      <div class="row between"><span class="mono muted" style="font-size:11px">${id.toUpperCase()}</span>${st}</div>
      <div class="addr">${c.addr}</div>
      <div class="row" style="align-items:baseline;gap:6px"><span class="num big" style="${c.status === "rejected" ? "color:var(--hard)" : ""}">€${c.rent}</span><span class="muted">/ month</span></div>
      <div class="row" style="flex-wrap:wrap;gap:4px">${src("listing", `${c.site} · rent`)}${src("listing", `${c.area} m²`)}</div>
      ${extra}
    </div>`
  }
  const cards = [
    card("c1", `${chk([["Lease", "stop"], ["Area", "stop"], ["Space", "stop"], ["Finance", "done"]])}<div class="badge hard" style="white-space:normal">Over budget: €1,450 &gt; €1,300 limit</div>`),
    card("c2", `${chk([["Lease", "done"], ["Area", "done"], ["Space", "done"], ["Finance", "done"]])}<div class="badge soft" style="white-space:normal">Rent per m² above the usual range</div>`),
    card("c3", `${chk([["Lease", "done"], ["Area", "done"], ["Space", "run"], ["Finance", "done"]])}<div class="badge soft" style="white-space:normal">Service charge not stated</div>`),
    card("c4", `${chk([["Lease", "done"], ["Area", "run"], ["Space", "run"], ["Finance", "done"]])}<div class="badge soft" style="white-space:normal">Check food use is allowed</div>`),
    card("c5", `${chk([["Lease", "run"], ["Area", ""], ["Space", ""], ["Finance", ""]])}<div class="badge est" style="white-space:normal">61 m² is above your 60 m² maximum</div>`),
  ]

  const ev = (t, cls, who, cand, text, srcs) => `<div class="ev ${cls}"><div class="t">${t}</div><div>
      <div class="row between"><span class="who">${who}</span><span class="mono muted" style="font-size:10.5px">${cand}</span></div>
      <p>${text}</p>${srcs ? `<div class="srcs">${srcs}</div>` : ""}</div></div>`
  const stream = [
    ev("00:41", "", "Location", "C4", "3 bakeries within 300 m. Waiting for your approval to run a second OSM batch.", src("osm", "query #18 · shop=bakery r=300m")),

/* ===================== 2. report ===================== */

    ${badge(cls, verdict)}</div>`
  const item = (k, v, s, est = false) => `<div class="item"><span>${k}</span><span class="val ${est ? "est" : ""}">${v}</span><span class="s">${s}</span></div>`
  const pos = (x) => ((x - 14) / (28 - 14)) * 100
